name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows quality gates and installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./cmd/... ./internal/...

      - name: go test
        run: go test ./cmd/... ./internal/...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/... ./internal/...

      - name: frontend lint
        working-directory: desktop
        run: npm run lint

      - name: frontend unit tests
        working-directory: desktop
        run: npm test

      - name: race and coverage gates
        working-directory: desktop
        run: npm run coverage

      - name: npm audit
        working-directory: desktop
        run: npm audit --audit-level=high

      - name: build Windows installers
        working-directory: desktop
        run: npm run build

      - name: development Electron smoke
        working-directory: desktop
        run: npm run test:smoke

      - name: portable Electron smoke
        shell: bash
        working-directory: desktop
        run: CABO_EXE_PATH=../artifacts/app/cabo.exe npm run test:smoke

      - name: upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: cabo-windows-amd64-portable
          path: artifacts/app/cabo.exe
          if-no-files-found: error

      - name: upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: cabo-windows-x64-setup
          path: artifacts/electron/CABO-*-windows-x64-setup.exe
          if-no-files-found: error

  android:
    name: Android arm64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./cmd/... ./internal/...

      - name: go test
        run: go test ./cmd/... ./internal/...

      - name: build Android Go server
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -buildmode=pie -trimpath -ldflags="-s -w" -o android/app/src/main/jniLibs/arm64-v8a/libcabo_server.so ./cmd/cabo
          go version -m android/app/src/main/jniLibs/arm64-v8a/libcabo_server.so
          file android/app/src/main/jniLibs/arm64-v8a/libcabo_server.so
          readelf -Wl android/app/src/main/jniLibs/arm64-v8a/libcabo_server.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: build Android APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon

      - name: verify and rename APK
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          unzip -l "$apk"
          cp "$apk" android/app/build/outputs/apk/debug/cabo-1.0.0-android-arm64.apk

      - name: upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: cabo-android-arm64-apk
          path: android/app/build/outputs/apk/debug/cabo-1.0.0-android-arm64.apk
          if-no-files-found: error
