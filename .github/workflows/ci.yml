name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: fmt / vet / test / build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        working-directory: desktop
        run: npm ci

      # 仓库里的 Go 源码必须已格式化，否则这里直接红
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./cmd/... ./internal/...

      - name: go test
        run: go test ./cmd/... ./internal/...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./cmd/... ./internal/...

      - name: frontend lint
        working-directory: desktop
        run: npm run lint

      - name: frontend unit tests
        working-directory: desktop
        run: npm test

      - name: race and coverage gates
        working-directory: desktop
        run: npm run coverage

      - name: npm audit
        working-directory: desktop
        run: npm audit --audit-level=high

      - name: build Electron portable
        working-directory: desktop
        run: npm run build

      - name: development Electron smoke
        working-directory: desktop
        run: npm run test:smoke

      - name: portable Electron smoke
        shell: bash
        working-directory: desktop
        run: CABO_EXE_PATH=../artifacts/app/cabo.exe npm run test:smoke

      - uses: actions/upload-artifact@v4
        with:
          name: cabo-windows-amd64
          path: artifacts/app/cabo.exe
          if-no-files-found: error
