plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dhktig.cabo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.dhktig.cabo'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
